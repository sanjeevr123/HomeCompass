services:
  - type: web
    name: homecompass-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
  - type: web
    name: homecompass-app
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install -r ../requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BACKEND_URL
        value: https://homecompass-backend.onrender.com
      - key: ONEMAP_API_EMAIL
        sync: false
      - key: ONEMAP_API_PASSWORD
        sync: false
